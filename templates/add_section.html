{% extends "layout.html" %}
{% block body %}
<h3>{{ section_texts[0] }}</h3>
<form action="{{ url_for('add_section_post') }}" method=post>
  <div class="form-group {% if form.section.errors %} has-error {% endif %}">
      {{ form.section(placeholder=section_texts[1], class="form-control",id="section") }}
      {% if form.section.errors %}
        <span class="help-block">{{ form.section.errors[0] }}</span>
      {% endif %}
  </div>

  {{ form.slot_key }}
  {{ form.game_key }}


  <p><button type="submit" class="btn btn-lg btn-block btn-primary" href="/incomplete" role="button">I'm done</button></p>
</form>
{% endblock %}
